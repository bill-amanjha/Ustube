<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f10">
  <title>Ustube Player</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100vh; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto; }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
    .stage { position: relative; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); overflow: hidden; }
    .stage iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(0,0,0,.75); z-index: 2; padding: 16px; }
    .overlay[hidden] { display: none; }
    .overlay .btn { font-size: 18px; padding: 14px 28px; }
    .np { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
    .np .title { font-weight: 700; font-size: 18px; }
    .side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-content: start; }
    .join { display: flex; gap: 14px; align-items: center; }
    #qr { background: #fff; padding: 8px; border-radius: 10px; flex: none; line-height: 0; }
    #qr img, #qr canvas { width: 116px; height: 116px; }
    .join-url { font-weight: 700; font-size: 16px; word-break: break-all; color: var(--accent-2); }
    .results:not(:empty) { margin-top: 10px; max-height: 40vh; overflow: auto; }
    #queue { max-height: 50vh; overflow: auto; }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <div class="brand"><span class="logo"></span>Ustube</div>
      <span class="small muted"><span class="dot" id="status"></span><span id="status-text">Connecting…</span></span>
    </header>

    <div>
      <div class="stage">
        <div id="yt"></div>
        <div class="overlay" id="overlay">
          <div>
            <button class="btn primary" id="start">▶ Start the party</button>
            <p class="small muted">Browsers need one click before they allow sound.</p>
          </div>
        </div>
      </div>
      <div class="np">
        <div>
          <div class="title" id="np-title">Nothing playing</div>
          <div class="small muted" id="np-sub">Add a song, or let guests scan the QR code.</div>
        </div>
        <button class="btn" id="skip">Skip ⏭</button>
      </div>
    </div>

    <aside class="side">
      <section class="panel join">
        <div id="qr"></div>
        <div>
          <div class="small muted">Friends on this Wi-Fi: scan or open</div>
          <div class="join-url" id="join-url">…</div>
        </div>
      </section>

      <section class="panel" id="add"></section>

      <section class="panel">
        <h2 class="section-title">Up next <span id="count"></span></h2>
        <div id="queue"></div>
      </section>
    </aside>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="/common.js"></script>
  <script src="/add.js"></script>
  <script>
    let player, playerReady = false, started = false, state = null, loadedId = null;

    mountAddBox(document.getElementById('add'), () => 'Host');

    // Join link + QR code for guests.
    api('/api/info').then(({ urls }) => {
      const url = urls[0] || location.origin + '/';
      document.getElementById('join-url').textContent = url;
      if (window.QRCode) new QRCode(document.getElementById('qr'), { text: url, width: 232, height: 232 });
    });

    // YouTube IFrame API. Runs inside your browser, so it uses your YouTube sign-in where the browser allows it.
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.append(tag);

    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('yt', {
        playerVars: { autoplay: 1, playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: () => { playerReady = true; sync(); },
          onStateChange: e => { if (e.data === YT.PlayerState.ENDED) next(); },
          onError: e => {
            const reason = { 2: 'bad video id', 5: 'HTML5 error', 100: 'video removed or private', 101: 'owner blocks embedding', 150: 'owner blocks embedding' }[e.data] || `error ${e.data}`;
            toast(`Skipping: ${reason}`);
            setTimeout(next, 1500);
          },
        },
      });
    };

    function next() {
      api('/api/next', { currentId: state?.nowPlaying?.id ?? null }).catch(err => toast(err.message));
    }

    // Load whatever the server says is playing, once the player is ready and the host has clicked start.
    function sync() {
      if (!playerReady || !started || !state) return;
      const n = state.nowPlaying;
      if (!n) {
        if (loadedId !== null) player.stopVideo();
        loadedId = null;
        return;
      }
      if (n.id !== loadedId) {
        loadedId = n.id;
        player.loadVideoById(n.videoId);
      }
    }

    function render(s) {
      state = s;
      const n = s.nowPlaying;
      document.getElementById('np-title').textContent = n ? n.title : 'Nothing playing';
      document.getElementById('np-sub').textContent = n ? [n.author, `added by ${n.addedBy}`].filter(Boolean).join(' · ') : 'Add a song, or let guests scan the QR code.';
      document.title = n ? `▶ ${n.title} · Ustube` : 'Ustube Player';

      document.getElementById('count').textContent = s.queue.length ? `(${s.queue.length})` : '';
      const q = document.getElementById('queue');
      if (!s.queue.length) q.replaceChildren(el('div', { class: 'empty', text: 'Queue is empty.' }));
      else q.replaceChildren(...s.queue.map((item, i) => trackRow(item, {
        actions: [
          el('button', { class: 'btn icon', text: '↑', title: 'Move up', onclick: () => api('/api/move', { id: item.id, dir: 'up' }) }),
          el('button', { class: 'btn icon', text: '↓', title: 'Move down', onclick: () => api('/api/move', { id: item.id, dir: 'down' }) }),
          el('button', { class: 'btn icon', text: '✕', title: 'Remove', onclick: () => api('/api/remove', { id: item.id }) }),
        ],
      })));
      sync();
    }

    // Only one player tab should play at a time; starting here pauses any other player tab in this browser.
    const channel = 'BroadcastChannel' in window ? new BroadcastChannel('ustube-player') : null;
    channel?.addEventListener('message', e => {
      if (e.data !== 'take-over' || !started) return;
      started = false;
      if (playerReady) player.pauseVideo();
      document.getElementById('start').textContent = '▶ Play here instead';
      document.getElementById('overlay').querySelector('p').textContent = 'The player was opened in another tab.';
      document.getElementById('overlay').hidden = false;
    });

    document.getElementById('start').addEventListener('click', () => {
      channel?.postMessage('take-over');
      started = true;
      document.getElementById('overlay').hidden = true;
      sync();
      if (playerReady && loadedId !== null) player.playVideo();
    });
    document.getElementById('skip').addEventListener('click', next);

    subscribe(render, live => {
      document.getElementById('status').classList.toggle('live', live);
      document.getElementById('status-text').textContent = live ? 'Live' : 'Server not reachable';
    });
  </script>
</body>
</html>
